const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryKey(token){
  const raw=b64(PAYLOAD),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(token),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
async function attempt(token,silent){
  if(!token)return;
  try{await tryKey(token.trim())}
  catch(e){if(!silent)document.getElementById("err").textContent="That key didn't work. Check the link or key and try again."}
}
document.getElementById("go").addEventListener("click",()=>attempt(document.getElementById("k").value,false));
document.getElementById("k").addEventListener("keydown",e=>{if(e.key==="Enter")attempt(e.target.value,false)});
const m=location.hash.match(/[#&]k=([^&]+)/);
if(m)attempt(decodeURIComponent(m[1]),false);
